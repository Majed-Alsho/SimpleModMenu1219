plugins {
    id "java"
    id "fabric-loom" version "1.11.4"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.9"

    // If this exact Yarn build doesn't exist on your machine,
    // your IDE will suggest the latest 1.21.9 build. Adjust there if needed.
    mappings "net.fabricmc:yarn:1.21.9+build.1:v2"

    modImplementation "net.fabricmc:fabric-loader:0.17.2"

    // 0.133.x includes 1.21.9 artifacts. Gradle will pick a matching one.
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.133.+"
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "net.fabricmc" && details.requested.name == "fabric-loader") {
            details.useVersion "0.17.2"
            details.because("Fabric API 1.21.9 requires loader >= 0.17.0")
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

loom {
    runs {
        client {
            client()
            configName = "Client"
            runDir = "run"
        }
    }
}












